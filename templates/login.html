<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tutor - Login</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="auth-form glass-card">
        <h2>Login</h2>
        <input type="text" id="loginId" placeholder="Username or Email">
        <input type="password" id="loginPassword" placeholder="Password">
        <button id="loginBtn" style="width: 100%;">Login</button>
        <p style="text-align: center; margin-top: 1rem;">Don't have an account? <a href="/register"
                style="color: var(--accent-color);">Register here</a></p>
    </div>
    <script src="/static/js/app.js"></script>
</body>

</html>
