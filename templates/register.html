<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tutor - Register</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="auth-form glass-card">
        <h2>Register</h2>
        <input type="text" id="regName" placeholder="Full Name">
        <input type="text" id="regUsername" placeholder="Username">
        <input type="email" id="regEmail" placeholder="Email Address">
        <input type="password" id="regPassword" placeholder="Password">
        <button id="regBtn" style="width: 100%;">Create Account</button>
        <p style="text-align: center; margin-top: 1rem;">Already registered? <a href="/login"
                style="color: var(--accent-color);">Login here</a></p>
    </div>
    <script src="/static/js/app.js"></script>
</body>

</html>
